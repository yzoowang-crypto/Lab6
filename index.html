<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Coffee Spot | Home</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar md:navbar-expand bg-1 border-bottom" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Campus Coffee Spot</a>
      <button class="btn navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#siteDrawer" aria-controls="siteDrawer" aria-label="Open menu">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-start" id="siteDrawer" aria-label="Site navigation">
        <div class="drawer-header">
          <strong>Menu</strong>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close menu"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html" aria-current="page">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#menu">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>
  <main class="container my-5">
    <header class="text-center mb-4">
      <h1 class="fw-bold">Welcome to Campus Coffee Spot</h1>
      <p>A student-run cafe concept with coffee, tea, and snacks.</p>
    </header>
    <section class="mb-5" aria-label="Coffee shop highlights">
      <div id="coffeeCarousel" class="carousel border rounded-3 p-2" aria-label="Coffee highlights">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="w-100 rounded-2" src="images/banner1.jpg" alt="A spacious coffee shop with green armchairs, brown sofas, and large windows">
          </div>
          <div class="carousel-item">
            <img class="w-100 rounded-2" src="images/banner2.jpg" alt="A warm cafe coffee bar with an espresso machine and a row of stools">
          </div>
          <div class="carousel-item">
            <img class="w-100 rounded-2" src="images/banner3.jpg" alt="Coffee and small desserts arranged on a dark table next to a notebook">
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 px-2">
          <button type="button" class="btn-outline theme-primary" data-bs-target="#coffeeCarousel" data-bs-slide="prev">
            <span class="carousel-icon-prev" aria-hidden="true"></span> Previous
          </button>
          <span class="fw-bold d-none md:d-block">Coffee &amp; Study Breaks</span>
          <button type="button" class="btn-outline theme-primary" data-bs-target="#coffeeCarousel" data-bs-slide="next">
            Next <span class="carousel-icon-next" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </section>

  </main>
  <footer class="bg-1 border-top py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 Campus Coffee Spot & A Student Website</p>
    </div>
  </footer>
</body>
</html>
